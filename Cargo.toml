[package]
name = "seiren-aec"
version = "0.1.0"
edition = "2024"

[dependencies]
aec3 = "0.4.0"
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
hound = "3.5.1"
nnnoiseless = { version = "0.5.2", default-features = false }
ringbuf = "0.6.0"
wasapi = "0.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
